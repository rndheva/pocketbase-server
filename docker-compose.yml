services:
  pocketbase:
    build: .
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
      - ./pb_hooks:/pb/pb_hooks
    environment:
      - BISIN_API_KEY=${BISIN_API_KEY}
    mem_limit: 384m
    cpus: 0.50

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pocketbase
    mem_limit: 64m
    cpus: 0.25

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${TUNNEL_TOKEN}
    depends_on:
      - gateway
    mem_limit: 64m
    cpus: 0.25